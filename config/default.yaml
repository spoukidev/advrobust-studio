# AdvRobust Studio default configuration
seed: 0
threads: 8
data_dir: data
checkpoint_dir: checkpoints
results_dir: results

training:
  batch_size: 256
  lr: 0.1
  eps: 8/255          # PGD-AT training budget (L-inf)
  pgd_steps: 3        # inner-max PGD iterations during AT (alpha = 2.5*eps/steps)
  checkpoints:
    cifar_cnn_vanilla:   {arch: cifar_cnn,    mode: vanilla, epochs: 10}
    cifar_cnn_pgdat:     {arch: cifar_cnn,    mode: pgd,     epochs: 10}
    cifar_resnet_vanilla: {arch: cifar_resnet, mode: vanilla, epochs: 10}

benchmark:
  n_eval: 500               # CIFAR-10 test images for the white-box attack table + transfer
  batch_size: 250
  eps_linf: 8/255
  eps_l2: 0.5
  pgd_steps: 10
  cw: {steps: 50, c: 1.0, lr: 0.01, n_eval: 200}
  eps_curve: [0, 1/255, 2/255, 4/255, 6/255, 8/255, 12/255, 16/255]
  curve_pgd_steps: 10
  curve_n_eval: 250
  defenses:
    jpeg: {quality: 75}
    bit_depth: {bits: 4}
    smoothing: {sigma: 0.08, n: 16}
  defense_n_eval: 200
  imagenet_demo:
    images: assets/imagenet_demo
    surrogate: resnet18
    victim: efficientnet_b0
    eps: 4/255
    steps: 10
